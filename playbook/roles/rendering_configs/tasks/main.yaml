---
- name: Create browsers.json for selenoid
  template:
    src: ./templates/browsers.json.j2
    dest: /root/chanyshev_selenoid/browsers.json
  vars:
    chrome_version1: 128.0
    chrome_version2: 127.0
  tags: selenoid_config

- name: Pull docker images with browser
  community.docker.docker_image_pull:
    name: "selenoid/{{ item }}"
    pull: "not_present"
  loop:
    - chrome:128.0
    - chrome:127.0
  tags: selenoid_config

- name: Create docker networks
  community.docker.docker_network:
    name: "{{ item }}"
  loop:
    - selenoid1
    - selenoid2
  tags: selenoid_config

- name: Create docker-compose.yaml for selenoid
  template:
    src: ./templates/docker_compose.yaml.j2
    dest: /root/chanyshev_selenoid/docker-compose.yaml
  vars:
    network1: selenoid1
    network2: selenoid2
    selenoid_path: /root/chanyshev_selenoid
  tags: selenoid_config

- name: Create grid-router folder
  file:
    path: /root/chanyshev_selenoid/grid-router/quota
    state: directory
  tags: selenoid_config

- name: Create quota file for ggr
  template:
    src: ./templates/test.xml.j2
    dest: /root/chanyshev_selenoid/grid-router/quota/test.xml
  vars:
    browser_version1: "128.0"
    browser_version2: "127.0"
  tags: selenoid_config

- name: Copy selenoid.conf nginx
  copy:
    src: ./templates/selenoid.conf
    dest: /root/chanyshev_selenoid/selenoid.conf
  tags: selenoid_config


- name: Running selenoid via docker-compose orkestration
  community.docker.docker_compose_v2:
    project_src: /root/chanyshev_selenoid
    state: present
  tags: selenoid_config

